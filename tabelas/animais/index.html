<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas!</title>
</head>
<body>
    <h1>Teste</h1>
    <table>
        <tr id="titulo">
            <th>First Header</th>
            <th>Second Header</th>
          </tr>
          <tr id="conteudo">
            <td>This is a data cell</td>
            <td>This is also a data cell!</td>
            <!-- <td>This is also a data cell!</td> // td = Adiciona uma nova coluna de informações, sem título. -->
          </tr>
    </table>

    <h1>Animals table</h1>

    <table>
      <tr>
        <th colspan="2">Animals</th>
      </tr>
      <tr>
        <th colspan="2">Hippopotamus</th>
      </tr>
      <tr>
        <th rowspan="2">Horse</th>
        <td>Mare</td>
      </tr>
      <tr>
        <td>Stallion</td>
      </tr>
      <tr>
        <th colspan="2">Crocodile</th>
      </tr>
      <tr>
        <th rowspan="2">Chicken</th>
        <td>Hen</td>
      </tr>
      <tr>
        <td>Rooster</td>
      </tr>
    </table>
</html>
</body>
</html>
